# Partial override merged with default.yaml.
# Goal: allow adaptation from very short severe-surprise episodes while keeping
# stronger anti-forgetting safeguards.

adaptation:
  confidence_threshold: 0.70
  confidence_window: 5
  min_episode_steps: 1
  min_adapt_reward: -20.0
  adapt_batch_size: 16
  adapt_epochs: 4
  adapt_lr: 1.0e-4
  ewc_lambda: 1000
  clean_replay_ratio: 0.50
  kl_anchor_coef: 0.8
